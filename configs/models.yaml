# 系统支持的AI模型配置
# 每个模型包含：provider:module 格式的ID、显示名称、服务商名称、描述
models:
  - id: "deepseek:deepseek-chat"
    name: "DeepSeek Chat"
    provider: "DeepSeek"
    description: "通用对话模型，性价比高"

  - id: "deepseek:deepseek-coder"
    name: "DeepSeek Coder"
    provider: "DeepSeek"
    description: "代码生成专家"

  - id: "kimi:moonshot-v1-8k"
    name: "Kimi 8K"
    provider: "Moonshot"
    description: "长上下文支持（8K）"

  - id: "kimi:moonshot-v1-32k"
    name: "Kimi 32K"
    provider: "Moonshot"
    description: "超长上下文支持（32K）"

  - id: "kimi:moonshot-v1-128k"
    name: "Kimi 128K"
    provider: "Moonshot"
    description: "极长上下文支持（128K）"

  - id: "openai:gpt-4"
    name: "GPT-4"
    provider: "OpenAI"
    description: "强大的通用模型"

  - id: "openai:gpt-4o"
    name: "GPT-4o"
    provider: "OpenAI"
    description: "GPT-4 Omni，多模态能力"

  - id: "openai:gpt-3.5-turbo"
    name: "GPT-3.5 Turbo"
    provider: "OpenAI"
    description: "快速经济的模型"

  - id: "glm:glm-4"
    name: "智谱 GLM-4"
    provider: "智谱AI"
    description: "中文优化模型"

  - id: "glm:glm-4-plus"
    name: "智谱 GLM-4 Plus"
    provider: "智谱AI"
    description: "更强的中文理解能力"
