<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>铜锌原电池 - 离子垂直闭环版 (V11)</title>
    <style>
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        #canvas-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            position: relative; 
        }

        .controls-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            backdrop-filter: blur(5px);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        button {
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            outline: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        button.start { background: #1976d2; color: white; }
        button.start:hover { background: #1565c0; transform: scale(1.05); }
        button.reset { background: #607d8b; color: white; }
        button.reset:hover { background: #546e7a; transform: scale(1.05); }

        .label { font-size: 16px; fill: #222; font-weight: 700; text-anchor: middle; }
        .sub-label { font-size: 13px; fill: #555; font-weight: normal; text-anchor: middle; }
        .equation { font-size: 15px; fill: #333; text-anchor: middle; font-family: Consolas, monospace; font-weight: bold;}
        .particle-text { font-size: 10px; font-weight: bold; font-family: Arial, sans-serif; user-select: none;}
        
        #bulb-light, #bulb-glow-ring { transition: opacity 0.3s ease; }
        .anim-particle { pointer-events: none; }
    </style>
</head>
<body>

<div id="canvas-container">
    <svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
        
        <defs>
            <marker id="arrow-yellow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#fbc02d" /></marker>
            <marker id="arrow-ion" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#78909c" /></marker>
            <g id="particle-electron"><circle r="7" fill="#ffd700" stroke="#f9a825" stroke-width="1"/><text y="3" class="particle-text" text-anchor="middle">e⁻</text></g>
            <g id="particle-zn"><circle r="9" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/><text y="4" class="particle-text" text-anchor="middle" fill="#333">Zn²⁺</text></g>
            <g id="particle-cu"><circle r="9" fill="#4fc3f7" stroke="#0288d1" stroke-width="1"/><text y="4" class="particle-text" text-anchor="middle">Cu²⁺</text></g>
            <g id="particle-k"><circle r="8" fill="#a5d6a7" stroke="#388e3c" stroke-width="1"/><text y="4" class="particle-text" text-anchor="middle">K⁺</text></g>
            <g id="particle-anion"><circle r="8" fill="#e1bee7" stroke="#8e24aa" stroke-width="1"/><text y="4" class="particle-text" text-anchor="middle">SO₄²⁻</text></g>

            <linearGradient id="glass-simple" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0.4"/><stop offset="20%" stop-color="#fff" stop-opacity="0.1"/><stop offset="80%" stop-color="#fff" stop-opacity="0.1"/><stop offset="100%" stop-color="#fff" stop-opacity="0.4"/></linearGradient>
            <radialGradient id="bulb-gradient"><stop offset="0%" stop-color="#fff59d"/><stop offset="100%" stop-color="#fbc02d"/></radialGradient>
            <linearGradient id="liq-zn" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eceff1" stop-opacity="0.3"/><stop offset="100%" stop-color="#cfd8dc" stop-opacity="0.6"/></linearGradient>
            <linearGradient id="liq-cu" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.7"/><stop offset="100%" stop-color="#0277bd" stop-opacity="0.9"/></linearGradient>
            <linearGradient id="metal-bezel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#e0e0e0" /><stop offset="50%" stop-color="#fafafa" /><stop offset="100%" stop-color="#bdbdbd" /></linearGradient>

            <clipPath id="clip-zn"><path d="M 120,380 L 120,530 Q 120,550 140,550 L 280,550 Q 300,550 300,530 L 300,380 Z" /></clipPath>
            <clipPath id="clip-cu"><path d="M 600,380 L 600,530 Q 600,550 620,550 L 760,550 Q 780,550 780,530 L 780,380 Z" /></clipPath>
        </defs>

        <g id="group-left">
            <path d="M 120,330 L 120,530 Q 120,560 150,560 L 270,560 Q 300,560 300,530 L 300,330" fill="#fff" stroke="#cfd8dc" stroke-width="2"/>
            <path d="M 125,380 L 125,530 Q 125,550 145,550 L 275,550 Q 295,550 295,530 L 295,380 Z" fill="url(#liq-zn)"/>
            <ellipse cx="210" cy="380" rx="85" ry="10" fill="#fff" opacity="0.4"/>

            <rect id="zn-elec-top" x="180" y="240" width="30" height="280" fill="#b0bec5" stroke="#78909c"/>
            <text x="160" y="260" class="label" text-anchor="end">Zn</text>
            <text x="160" y="280" class="sub-label" text-anchor="end">阳极</text>
            <g clip-path="url(#clip-zn)">
                <rect id="zn-elec-bot" x="180" y="240" width="30" height="280" fill="#90a4ae" opacity="0.6"/>
            </g>
            
            <g id="zn-static-ions" opacity="0.5">
                <use href="#particle-zn" x="150" y="400" /> 
                <use href="#particle-anion" x="240" y="400" />
            </g>
            <g id="zn-dynamic-ions"></g>

            <path d="M 120,330 L 120,530 Q 120,560 150,560 L 270,560 Q 300,560 300,530 L 300,330" fill="url(#glass-simple)" pointer-events="none"/>
        </g>

        <g id="group-right">
            <path d="M 600,330 L 600,530 Q 600,560 630,560 L 750,560 Q 780,560 780,530 L 780,330" fill="#fff" stroke="#cfd8dc" stroke-width="2"/>
            <path d="M 605,380 L 605,530 Q 605,550 625,550 L 755,550 Q 775,550 775,530 L 775,380 Z" fill="url(#liq-cu)"/>
            <ellipse cx="690" cy="380" rx="85" ry="10" fill="#81d4fa" opacity="0.3"/>

            <rect id="cu-elec-top" x="690" y="240" width="30" height="280" fill="#a1887f" stroke="#5d4037"/>
            <text x="740" y="260" class="label" text-anchor="start">Cu</text>
            <text x="740" y="280" class="sub-label" text-anchor="start">阴极</text>
            <g clip-path="url(#clip-cu)">
                <rect id="cu-elec-bot" x="690" y="240" width="30" height="280" fill="#6d4c41"/>
                <rect id="cu-elec-bot-tint" x="690" y="240" width="30" height="280" fill="#01579b" opacity="0.3"/>
            </g>

            <g id="cu-static-ions" opacity="0.5">
                 <use href="#particle-cu" x="630" y="400" />
                 <use href="#particle-anion" x="720" y="400" />
            </g>
            <g id="cu-dynamic-ions"></g>

            <path d="M 600,330 L 600,530 Q 600,560 630,560 L 750,560 Q 780,560 780,530 L 780,330" fill="url(#glass-simple)" pointer-events="none"/>
        </g>

        <g id="salt-bridge">
            <path d="M 240,460 L 240,320 Q 240,250 310,250 L 590,250 Q 660,250 660,320 L 660,460" fill="none" stroke="#e1f5fe" stroke-width="36" opacity="0.9"/>
            <path d="M 240,460 L 240,320 Q 240,250 310,250 L 590,250 Q 660,250 660,320 L 660,460" fill="none" stroke="url(#glass-simple)" stroke-width="40"/>
            <path d="M 220,460 L 220,320 Q 220,230 310,230 L 590,230 Q 680,230 680,320 L 680,460" fill="none" stroke="#90a4ae" stroke-width="1"/>
            <path d="M 260,460 L 260,320 Q 260,270 310,270 L 590,270 Q 640,270 640,320 L 640,460" fill="none" stroke="#90a4ae" stroke-width="1"/>
            <rect x="222" y="450" width="36" height="10" fill="#fff" opacity="0.8"/>
            <rect x="642" y="450" width="36" height="10" fill="#fff" opacity="0.8"/>

            <text x="450" y="215" class="label" font-size="18">盐桥 (Salt Bridge)</text>
            
            <path id="path-anion-flow" d="M 450,250 L 310,250 Q 240,250 240,320 L 240,500" fill="none" stroke="none" />
            <path id="path-cation-flow" d="M 450,250 L 590,250 Q 660,250 660,320 L 660,500" fill="none" stroke="none" />

            <g id="bridge-anim-layer"></g>
        </g>

        <g id="circuit">
            <path id="wire-path" d="M 195,240 L 195,140 Q 195,120 215,120 L 685,120 Q 705,120 705,140 L 705,240" 
                  fill="none" stroke="#37474f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            
            <g transform="translate(450, 120)">
                <rect x="-15" y="-5" width="30" height="15" fill="#555"/>
                <circle cx="0" cy="-25" r="25" fill="url(#bulb-gradient)" stroke="#fbc02d" stroke-width="2"/>
                <circle id="bulb-light" cx="0" cy="-25" r="25" fill="#fff" opacity="0"/> 
                <circle id="bulb-glow-ring" cx="0" cy="-25" r="35" fill="gold" opacity="0" filter="blur(8px)"/> 
                <path d="M -8,-15 L -5,-30 L 0,-25 L 5,-30 L 8,-15" fill="none" stroke="#fff" stroke-width="2"/>
            </g>
            
            <g transform="translate(600, 120)">
                <circle r="32" fill="url(#metal-bezel)" stroke="#9e9e9e" stroke-width="1"/>
                <circle r="28" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
                <path d="M -20,10 Q 0,-20 20,10" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="0" y1="-18" x2="0" y2="-24" stroke="#333" stroke-width="2"/>
                <text y="-8" font-size="10" fill="#333" text-anchor="middle">0</text>
                <text y="18" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">A</text>
                <g id="ammeter-needle" transform="rotate(0)">
                    <circle r="3" fill="#333"/>
                    <path d="M -2,0 L 2,0 L 0,-22 Z" fill="#d32f2f"/>
                </g>
                <ellipse cx="0" cy="-10" rx="25" ry="15" fill="#fff" opacity="0.3"/>
            </g>

            <text x="320" y="90" class="label" fill="#f9a825">电子流向</text>
            <path d="M 320,105 L 380,105" stroke="#fbc02d" stroke-width="3" marker-end="url(#arrow-yellow)"/>
            
            <g id="electron-anim-layer"></g>
            <g id="static-electrons">
                <use href="#particle-electron" x="195" y="180"/>
                <use href="#particle-electron" x="300" y="120"/>
                <use href="#particle-electron" x="550" y="120"/>
                <use href="#particle-electron" x="705" y="180"/>
            </g>
        </g>

        <g transform="translate(210, 600)">
            <text y="0" class="label" fill="#333">ZnSO₄ 溶液</text>
            <text y="30" class="equation" fill="#c62828">Zn - 2e⁻ → Zn²⁺</text>
            <text y="50" class="sub-label" fill="#c62828">氧化反应 (Oxidation)</text>
        </g>
        <g transform="translate(690, 600)">
            <text y="0" class="label" fill="#333">CuSO₄ 溶液</text>
            <text y="30" class="equation" fill="#0277bd">Cu²⁺ + 2e⁻ → Cu</text>
            <text y="50" class="sub-label" fill="#0277bd">还原反应 (Reduction)</text>
        </g>

    </svg>

    <div class="controls-overlay">
        <button class="start" onclick="toggleSimulation()">▶ 开始实验</button>
        <button class="reset" onclick="resetSimulation()">↺ 重置</button>
    </div>
</div>

<script>
    let isRunning = false;
    let animFrame;
    let frameCount = 0;
    
    // 引用
    const wirePath = document.getElementById('wire-path');
    const pathAnionFlow = document.getElementById('path-anion-flow');
    const pathCationFlow = document.getElementById('path-cation-flow');
    
    const electronLayer = document.getElementById('electron-anim-layer');
    const staticElectronLayer = document.getElementById('static-electrons');
    const bulbLight = document.getElementById('bulb-light');
    const bulbGlow = document.getElementById('bulb-glow-ring');
    const needle = document.getElementById('ammeter-needle');
    
    const znRects = [document.getElementById('zn-elec-top'), document.getElementById('zn-elec-bot')];
    const cuRects = [document.getElementById('cu-elec-top'), document.getElementById('cu-elec-bot'), document.getElementById('cu-elec-bot-tint')];
    
    const znDynamicLayer = document.getElementById('zn-dynamic-ions');
    const cuDynamicLayer = document.getElementById('cu-dynamic-ions');
    const bridgeLayer = document.getElementById('bridge-anim-layer');

    // 1. 电子系统
    const WIRE_LEN = wirePath.getTotalLength();
    const BRIDGE_ANION_LEN = pathAnionFlow.getTotalLength();
    const BRIDGE_CATION_LEN = pathCationFlow.getTotalLength();
    
    const electrons = [];
    function initElectrons() {
        electronLayer.innerHTML = '';
        electrons.length = 0;
        for(let i=0; i<10; i++) {
            const el = document.createElementNS("http://www.w3.org/2000/svg", "use");
            el.setAttribute("href", "#particle-electron");
            el.style.opacity = "0";
            electronLayer.appendChild(el);
            electrons.push({ el: el, dist: (i / 10) * WIRE_LEN });
        }
    }

    // 2. 盐桥垂直流动系统 (核心升级)
    const bridgeIons = [];
    function initBridge() {
        bridgeLayer.innerHTML = '';
        bridgeIons.length = 0;
        
        // 初始化一些阴离子 (向左下潜)
        for(let i=0; i<6; i++) {
            createBridgeIon(true, Math.random() * BRIDGE_ANION_LEN);
        }
        // 初始化一些阳离子 (向右下潜)
        for(let i=0; i<6; i++) {
            createBridgeIon(false, Math.random() * BRIDGE_CATION_LEN);
        }
    }

    function createBridgeIon(isAnion, startDist) {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "use");
        el.setAttribute("href", isAnion ? "#particle-anion" : "#particle-k");
        el.style.opacity = "0"; // 初始不可见，只有在动画中才设为可见
        bridgeLayer.appendChild(el);
        bridgeIons.push({ 
            el: el, 
            isAnion: isAnion,
            dist: startDist,
            totalLen: isAnion ? BRIDGE_ANION_LEN : BRIDGE_CATION_LEN 
        });
    }

    function animate() {
        if (!isRunning) return;
        frameCount++;

        // --- 电子 ---
        electrons.forEach(p => {
            p.dist += 4;
            if (p.dist > WIRE_LEN) p.dist = 0;
            const pt = wirePath.getPointAtLength(p.dist);
            p.el.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);
            p.el.style.opacity = "1";
        });

        // --- 盐桥离子垂直下潜 ---
        bridgeIons.forEach(p => {
            p.dist += 1.5; // 流动速度
            if (p.dist > p.totalLen) p.dist = 0; // 循环
            
            const path = p.isAnion ? pathAnionFlow : pathCationFlow;
            const pt = path.getPointAtLength(p.dist);
            p.el.setAttribute("transform", `translate(${pt.x}, ${pt.y})`);
            
            // 视觉处理：
            // 1. 在管道水平部分 (top) 透明度为 1
            // 2. 刚进入溶液时透明度为 1
            // 3. 深入溶液后 (dist > 80% total) 逐渐消失，模拟溶解
            let opacity = 1;
            if (p.dist > p.totalLen * 0.8) {
                opacity = 1 - (p.dist - p.totalLen * 0.8) / (p.totalLen * 0.2);
            }
            p.el.style.opacity = opacity;
        });

        // --- 仪表 ---
        const jitter = Math.sin(frameCount * 0.5) * 2 + Math.random() * 1.5;
        needle.setAttribute("transform", `rotate(${25 + jitter})`);

        // --- 电极 ---
        const znW = Math.max(10, 30 - frameCount * 0.005);
        const cuW = Math.min(50, 30 + frameCount * 0.005);
        znRects.forEach(r => { r.setAttribute("width", znW); r.setAttribute("x", 180 + (30-znW)/2); });
        cuRects.forEach(r => { r.setAttribute("width", cuW); r.setAttribute("x", 690 - (cuW-30)/2); });

        // --- 溶液动态 ---
        if (frameCount % 50 === 0) spawnZnIon();
        if (frameCount % 40 === 0) spawnCuDeposition();
        updateSolutionIons();

        animFrame = requestAnimationFrame(animate);
    }

    // 溶液离子逻辑
    const activeSolutionIons = [];
    function spawnZnIon() {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "use");
        el.setAttribute("href", "#particle-zn");
        el.style.pointerEvents = "none";
        const startX = 180 + 15 + (Math.random()*10 - 5);
        const startY = 300 + Math.random() * 150;
        el.setAttribute("x", startX);
        el.setAttribute("y", startY);
        znDynamicLayer.appendChild(el);
        activeSolutionIons.push({ el: el, x: startX, y: startY, life: 1.0, type: 'zn' });
    }

    function spawnCuDeposition() {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "use");
        el.setAttribute("href", "#particle-cu");
        el.style.pointerEvents = "none";
        const startX = 640 + Math.random() * 100;
        const startY = 380 + Math.random() * 100;
        el.setAttribute("x", startX);
        el.setAttribute("y", startY);
        cuDynamicLayer.appendChild(el);
        activeSolutionIons.push({ el: el, x: startX, y: startY, targetX: 690 + 15, type: 'cu' });
    }

    function updateSolutionIons() {
        for(let i=activeSolutionIons.length-1; i>=0; i--) {
            const p = activeSolutionIons[i];
            
            if (p.type === 'zn') {
                p.x += 0.2; 
                p.y += (Math.random() - 0.4) * 1;
                p.life -= 0.005;
                p.el.setAttribute("x", p.x);
                p.el.setAttribute("y", p.y);
                p.el.style.opacity = p.life;
                if(p.life <= 0) { p.el.remove(); activeSolutionIons.splice(i, 1); }
            } else {
                const dx = p.targetX - p.x;
                p.x += dx * 0.03;
                p.y += (Math.random()-0.5) * 1;
                p.el.setAttribute("x", p.x);
                p.el.setAttribute("y", p.y);
                if(Math.abs(dx) < 2) { p.el.remove(); activeSolutionIons.splice(i, 1); }
            }
        }
    }

    function toggleSimulation() {
        if (isRunning) return;
        isRunning = true;
        document.querySelector('button.start').innerHTML = "⚙ 运行中...";
        document.querySelector('button.start').style.background = "#1565c0";
        
        staticElectronLayer.style.display = 'none';
        bulbLight.style.opacity = 0.6;
        bulbGlow.style.opacity = 0.5;
        
        animate();
    }

    function resetSimulation() {
        isRunning = false;
        cancelAnimationFrame(animFrame);
        frameCount = 0;
        
        document.querySelector('button.start').innerHTML = "▶ 开始实验";
        document.querySelector('button.start').style.background = "#1976d2";

        staticElectronLayer.style.display = 'block';
        bulbLight.style.opacity = 0;
        bulbGlow.style.opacity = 0;
        needle.setAttribute("transform", "rotate(0)");
        
        znRects.forEach(r => { r.setAttribute("width", 30); r.setAttribute("x", 180); });
        cuRects.forEach(r => { r.setAttribute("width", 30); r.setAttribute("x", 690); });
        
        znDynamicLayer.innerHTML = ''; 
        cuDynamicLayer.innerHTML = ''; 
        bridgeLayer.innerHTML = '';
        activeSolutionIons.length = 0;
        bridgeIons.length = 0;
        
        initElectrons();
        initBridge();
    }

    initElectrons();
    initBridge();
    
</script>

</body>
</html>
