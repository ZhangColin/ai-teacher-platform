<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 代码沙箱</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: monospace;
            background: #f5f5f5;
        }
        #output {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            min-height: 100px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h3>JS 代码沙箱</h3>
    <div id="output">等待执行...</div>

    <script>
        (function() {
            'use strict';

            // 定义预期的来源（安全限制）
            const EXPECTED_ORIGIN = window.location.origin;

            // 保存原始的 console 方法
            const originalConsole = {
                log: console.log.bind(console),
                warn: console.warn.bind(console),
                error: console.error.bind(console)
            };

            // 向父窗口发送消息
            function sendMessage(type, data) {
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: type,
                        ...data
                    }, EXPECTED_ORIGIN);
                }
            }

            // 处理来自父窗口的消息
            window.addEventListener('message', function(event) {
                // 安全检查：验证消息来源
                if (event.origin !== EXPECTED_ORIGIN) {
                    return; // 忽略来自非预期来源的消息
                }

                // 只处理 'execute' 类型的消息
                if (event.data?.type !== 'execute') {
                    return;
                }

                const code = event.data.code;
                if (typeof code !== 'string') {
                    sendMessage('status', { status: 'error' });
                    sendMessage('stderr', { content: '错误：代码必须是字符串' });
                    return;
                }

                // 发送运行状态
                sendMessage('status', { status: 'running' });

                // 劫持 console 方法
                console.log = function(...args) {
                    sendMessage('stdout', {
                        content: args.map(arg =>
                            typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                        ).join(' ')
                    });
                };

                console.warn = function(...args) {
                    sendMessage('stdout', {
                        content: '[警告] ' + args.map(arg =>
                            typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                        ).join(' ')
                    });
                };

                console.error = function(...args) {
                    sendMessage('stderr', {
                        content: '[错误] ' + args.map(arg =>
                            typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
                        ).join(' ')
                    });
                };

                try {
                    // 使用 new Function 执行代码（比 eval 更安全）
                    const fn = new Function(code);
                    fn();

                    // 执行成功
                    sendMessage('status', { status: 'done' });

                } catch (error) {
                    // 执行出错
                    sendMessage('stderr', {
                        content: error.toString()
                    });
                    sendMessage('status', { status: 'error' });
                } finally {
                    // 恢复原始的 console 方法
                    console.log = originalConsole.log;
                    console.warn = originalConsole.warn;
                    console.error = originalConsole.error;
                }
            });

            // 页面加载完成后发送 ready 状态
            window.addEventListener('load', function() {
                sendMessage('status', { status: 'ready' });
                document.getElementById('output').textContent = '沙箱已就绪';
            });
        })();
    </script>
</body>
</html>
