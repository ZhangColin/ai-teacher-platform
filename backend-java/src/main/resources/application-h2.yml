spring:
  application:
    name: ai-teacher-platform

  # H2 内存数据库配置（用于快速测试）
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  # H2 控制台
  h2:
    console:
      enabled: true
      path: /h2-console

# 服务器配置
server:
  port: 8080
  compression:
    enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.platform: DEBUG
    org.hibernate.SQL: DEBUG

# AI模型配置
ai:
  provider:
    current: deepseek
  providers:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:test-key-for-development}
      base-url: https://api.deepseek.com/v1

# JWT配置
jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long-for-security
  expiration: 86400000

# 工具配置（禁用文件加载）
tools:
  config-dir: /tmp/tools
  cache-duration: 300
