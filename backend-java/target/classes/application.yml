spring:
  application:
    name: ai-teacher-platform

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/hcy_studio?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: truth
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AiTeacherHikariCP
      minimum-idle: 5
      maximum-pool-size: 20
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

# 服务器配置
server:
  port: 8080
  compression:
    enabled: true

# 日志配置
logging:
  level:
    root: INFO
    com.platform: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# AI模型配置
ai:
  # 当前使用的提供商（openai, deepseek, kimi）
  provider:
    current: ${CURRENT_PROVIDER:deepseek}
  providers:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    deepseek:
      api-key: sk-235ad37fb20540178f84043a80dce03b
      base-url: https://api.deepseek.com
    kimi:
      api-key: ${KIMI_API_KEY:}
      base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}

# JWT配置
jwt:
  secret: dev-secret-key-change-in-production-please-use-python-c-secrets-token-urlsafe-32
  expiration: 86400000 # 24小时（毫秒）

# 工具配置加载
tools:
  config-dir: configs/tools
  cache-duration: 300 # 5分钟缓存
