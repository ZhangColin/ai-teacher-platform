spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:schema.sql'
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

jwt:
  secret: test-secret-key-for-jwt-hs512-must-be-at-least-64-characters-long-12345
  expiration: 3600000
  long-lived-expiration: 604800000

ai:
  provider:
    current: test
  providers:
    test:
      api-key: test-api-key
      base-url: http://localhost:8080

  sql:
    init:
      mode: always
